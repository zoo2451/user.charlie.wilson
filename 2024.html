<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>user.charlie.wilson.myphotos</title>
    <link rel="icon" href="images/internet.png" type="image/png">
  <link rel="stylesheet" href="stylephotogallery.css" />
</head>
<body>
<body>
<div id="main-content" class="main-content">
    <div class="tab-photos">
        <div class="title-bar" id="titleBar">
            <div class="window-icon">
                <img src="images/folder_camera.png" alt="icon">
            </div>
            <div class="window-title">My photos/2024 - Charlie</div>
            <div class="window-controls">
                <div class="control-button close-btn" onclick="closeWindow()"></div>
            </div>
        </div>
        <div class="menu-bar">
            <div class="menu-item">File</div>
            <div class="menu-item">Edit</div>
            <div class="menu-item">Notes</div>
            <div class="menu-item" id="view-menu">View
              <div class="menu-item-dropdown" id="ViewDropdown" style="display:none;">
                <div class="dropdown-item" id = "A to Z-btn">By Name &#8593;</div>
                <div class="dropdown-item" id = "Z to A-btn">By Name &#8595;</div>
              </div>
            </div>
            <div class="menu-item">Help</div>
        </div>

        <div class="toolbar">
            <button class="toolbar-button icon-only" id="back-btn" title="Back">
                <img src="images/toolbar_greenbackbutton.png" alt="Back" style="padding-right: 5px;">
                Back
            </button>
            
            
            <button class="toolbar-button icon-only disabled" title="Forward">
                <img src="images/toolbar_forwardbutton.png" alt="Forward">
            </button>
            
            <button class="toolbar-button icon-only" title="Up">
                <img src="images/toolbar_exportfolder.png" alt="Up">
            </button>
            
            <div class="toolbar-separator"></div>
            
            <button class="toolbar-button search-button" title="Search" onclick="toggleSearch()">
                <img src="images/toolbar_search.png" alt="Search">
                Search
            </button>
            
            <button class="toolbar-button folders-button" title="Folders">
                <img src="images/toolbar_folders.png" alt="Folders">
                Folders
            </button>
            
            <div class="toolbar-separator"></div>
            
            <button class="toolbar-button view-dropdown" title="Views">
                <img src="images/toolbar_controlpanel.png" alt="Views">
            </button>
        </div>
        <div class="search-container" id="searchContainer">
            <span class="search-label">Search for:</span>
            <input type="text" class="search-input" id="searchInput" placeholder="Type to search photos..." >
            <button class="search-close-btn" onclick="closeSearch()" title="Close search">×</button>
        </div>
        <div class="window-content" id ="windowcontent">
            <div class="photo-gallery" id="photoGallery">
                <!-- Images will be dynamically loaded here by JavaScript -->
            </div>
        </div>
      </div>
      <div class="lil-tab-photos" id="lilTabPhotos">
        <div class="title-bar" id="liltitleBar">
            <div class="window-icon">
                <img src="images/folder_camera.png" alt="icon">
            </div>
            <div class="window-title">My photos- Charlie</div>
            <div class="window-controls">
                <div class="control-button close-btn" id="closebtn"></div>
            </div>
        </div>
        <div class="menu-bar">
            <div class="menu-item" id="lil-file-menu">File</div>
            <div class="lil-file-dropdown" id="lilFileDropdown" style="display:none;">
              <div class="dropdown-item" id = "download-btn">Download</div>
            </div>
            <div class="menu-item">Edit</div>
            <div class="menu-item">Format</div>
            <div class="menu-item" id="lil-view-menu">View</div>
              <div class="lil-view-dropdown" id="lilViewDropdown" style="display:none;">
                <div class="dropdown-item" id = "rotate90-btn">Rotate 90</div>
                <div class="dropdown-item" id = "rotate180-btn">Rotate 180</div>
                <div class="dropdown-item" id = "flipH-btn">Flip Horizontally</div>
                <div class="dropdown-item" id = "flipV-btn">Flip Vertically</div>
              </div>
            <div class="menu-item">Help</div>
        </div>
        <div id="enlarged-photo" class="enlarged-photo">
            <img id="enlarged-photo-img" src="" alt="Enlarged Image">
        </div>
    </div>
      </div>
<div class="taskbar">
      <a href="index.html" class="start"onclick="playStartAudio(event), closeWindow()">    
        <img src="images/windows_logo.png" alt="Start">
        <div class="start-text">start</div>
      </a>
      <a class="taskbar-button">
        <img src="images/Screenshot 2025-06-04 174226.png" alt="Film" style="height:16px; vertical-align:middle; margin-right:6px;">
      </a>
      <audio id="start-audio">
        <source src="images/winxp.mp3" type="audio/mp3">
            Your browser does not support the audio tag.
      </audio>
        <a class="backarrow">&lt;</a>
      <span id="clock">
        <img src="images/Screenshot 2025-06-04 170026.png" alt="clock logos" class="clock-icon" style="height:16px; vertical-align:middle; margin-right:6px;">
        <span id="clock-time"></span>
      </span>
    </div>
  


  <script src="basic.js"></script>
  <script src="clock.js"></script>
  <script src="photogallery2024.js"></script>
  <script src="photogallery.js"></script>
    <script src="draggable-tab.js"></script>
</body>
</html>
