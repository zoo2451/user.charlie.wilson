<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>user.charlie.wilson</title>
  <link rel="icon" href="images/internet.png" type="image/png">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="desktop.css" />
</head>
<body>
  <div id="bsod-screen">
    <div id="bsod-text"></div>
      <div id="continue-prompt">Press ENTER or click to continue <span class="cursor">&nbsp;</span></div>
    </div>
  <div id="loader-screen">
    <video id="intro-video" playsinline preload="auto">
      <source src="images/Untitled video - Made with Clipchamp.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <audio id="loading-audio">
      <source src="images/winxp.mp3" type="audio/mp3">
      Your browser does not support the audio tag.
    </audio>
  </div>
  <div id="main-content" class="main-content">
    <!-- Desktop icons. Each needs a unique data-icon-id so desktop.js can remember
         where it was moved and whether it is in the Recycle Bin. -->
    <div class="desktop-icons-container" id="desktop-icons">
      <a href="film.html" class="my-photos" data-icon-id="my-photos">
        <img src="images/folder_camera.png" alt="images">
        <span>My photos</span>
      </a>
      <a href="documents.html" class="my-documents" data-icon-id="my-documents">
        <img src="images/folder_documents.png" alt="documents">
        <span>My documents</span>
      </a>
      <a href="music.html" class="my-music" data-icon-id="my-music">
        <img src="images/folder_tape.png" alt="music">
        <span>My music</span>
      </a>
      <a href="chromegame.html" class="chromegame" data-icon-id="chromegame">
        <img src="images/folder_tape.png" alt="Sudoku">
        <span>Sudoku</span>
      </a>
      <a href="mailto:mattcwilson132@gmail.com" class="contact-form" data-icon-id="contact-form">
        <img src="images/notes.png" alt="Contact Form">
        <span>Contact Form</span>
      </a>
      <!-- The Recycle Bin can't be thrown away; clicking it opens the window below -->
      <a href="#" class="recycle-bin" data-icon-id="recycle-bin">
        <img src="images/recycle_bin_empty.png" alt="Recycle Bin">
        <span>Recycle Bin</span>
      </a>
    </div>

    <!-- Recycle Bin window -->
    <div class="xp-window" id="recycle-window" hidden>
      <div class="xp-title-bar" id="recycle-title-bar">
        <img class="xp-title-icon" src="images/recycle_bin_empty.png" alt="">
        <div class="xp-title-text">Recycle Bin</div>
        <button class="xp-close-btn" id="recycle-close" title="Close" aria-label="Close"></button>
      </div>
      <div class="xp-menu-bar">
        <div class="xp-menu-item">File</div>
        <div class="xp-menu-item">Edit</div>
        <div class="xp-menu-item">View</div>
        <div class="xp-menu-item">Help</div>
      </div>
      <div class="xp-toolbar">
        <button class="xp-toolbar-button" id="recycle-empty">Empty Recycle Bin</button>
        <button class="xp-toolbar-button" id="recycle-restore" disabled>Restore this item</button>
      </div>
      <div class="xp-window-body" id="recycle-items">
        <!-- filled in by desktop.js -->
      </div>
      <div class="xp-status-bar" id="recycle-status">0 objects</div>
    </div>
    <div id="tab-animation" class="tab-animation">

    </div>
    <div class="taskbar">
      <a href="index.html" class="start">    
        <img src="images/windows_logo.png" alt="Start">
        <div class="start-text">start</div>
      </a>
      <a class="taskbar-button">
        <img src="images/Screenshot 2025-06-04 174226.png" alt="Film" style="height:16px; vertical-align:middle; margin-right:6px;">
      </a>
        <a class="backarrow">&lt;</a>
      <span id="clock">
        <img src="images/Screenshot 2025-06-04 170026.png" alt="clock logos" class="clock-icon" style="height:16px; vertical-align:middle; margin-right:6px;">
        <span id="clock-time"></span>
      </span>
    </div>
  </div>
  


  <script src="clock.js"></script>
  <script src="basic.js"></script>
  <script src="script.js"></script>
  <script src="desktop.js"></script>
</body>
</html>
