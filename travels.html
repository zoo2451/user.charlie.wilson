<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>user.charlie.wilson.mytravels</title>
  <link rel="icon" href="images/internet.png" type="image/png">
  <link rel="stylesheet" href="style2.css" />
  <link rel="stylesheet" href="travels.css" />
</head>
<body>
<div id="main-content" class="main-content">
    <div class="tab-photos">
        <div class="title-bar">
            <div class="window-icon">
                <img src="images/internet.png" alt="icon">
            </div>
            <div class="window-title">My travels - Charlie</div>
            <div class="window-controls">
                <div class="control-button close-btn" onclick="closeWindow()"></div>
            </div>
        </div>
        <div class="menu-bar">
            <div class="menu-item">File</div>
            <div class="menu-item">Edit</div>
            <div class="menu-item">View</div>
            <div class="menu-item">Help</div>
        </div>
        <div class="window-content travels-content">
            <div class="travel-map-wrap" id="mapWrap">
                <canvas id="travelMap" aria-label="World map with a pin for every place I've been"></canvas>
                <div class="map-tip" id="mapTip" hidden></div>
                <div class="map-zoom">
                    <button id="mapZoomIn" title="Zoom in (or scroll / double-click the map)">+</button>
                    <button id="mapZoomOut" title="Zoom out">&minus;</button>
                    <button id="mapZoomWorld" title="Whole world">&#9675;</button>
                </div>
            </div>

            <div class="travel-tabs" role="tablist">
                <button class="travel-tab active" data-tab="general" role="tab">General</button>
                <button class="travel-tab" data-tab="cities" role="tab">Cities</button>
                <button class="travel-tab" data-tab="flags" role="tab">Flags</button>
                <button class="travel-tab" data-tab="animals" role="tab">Animals</button>
            </div>
            <div class="travel-panel" id="panel-general"></div>
            <div class="travel-panel" id="panel-cities" hidden></div>
            <div class="travel-panel" id="panel-flags" hidden></div>
            <div class="travel-panel" id="panel-animals" hidden></div>
            <div class="travel-credit">
                City data: <a href="https://www.geonames.org/" target="_blank" rel="noopener">GeoNames</a>.
                Map: <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a>.
                Flags: <a href="https://flagcdn.com/" target="_blank" rel="noopener">flagcdn</a>.
            </div>
        </div>
    </div>
</div>
<div class="taskbar">
      <a href="index.html" class="start" onclick="playStartAudio(event), closeWindow()">
        <img src="images/windows_logo.png" alt="Start">
        <div class="start-text">start</div>
      </a>
      <a class="taskbar-button">
        <img src="images/internet.png" alt="My travels" style="height:16px; vertical-align:middle; margin-right:6px;">
      </a>
      <audio id="start-audio">
        <source src="images/winxp.mp3" type="audio/mp3">
      </audio>
      <a class="backarrow">&lt;</a>
      <span id="clock">
        <img src="images/Screenshot 2025-06-04 170026.png" alt="clock logos" class="clock-icon" style="height:16px; vertical-align:middle; margin-right:6px;">
        <span id="clock-time"></span>
      </span>
</div>

  <script src="basic.js"></script>
  <script src="clock.js"></script>
  <script src="places.js"></script>
  <script src="animals.js"></script>
  <script src="travels.js"></script>
</body>
</html>
